<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TETRA_CORE - Game Over</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#8e9193",
                        "on-tertiary-fixed-variant": "#494640",
                        "on-secondary-container": "#abb9d2",
                        "surface-container-high": "#2a2a2a",
                        "error": "#ffb4ab",
                        "primary-container": "#e0e3e5",
                        "on-background": "#e5e2e1",
                        "surface": "#131313",
                        "surface-bright": "#3a3939",
                        "on-tertiary-fixed": "#1d1b16",
                        "inverse-primary": "#5c5f61",
                        "error-container": "#93000a",
                        "background": "#131313",
                        "on-error": "#690005",
                        "tertiary-container": "#e7e2d9",
                        "on-surface": "#e5e2e1",
                        "surface-dim": "#131313",
                        "outline-variant": "#444749",
                        "secondary-container": "#3c4a5e",
                        "secondary-fixed": "#d5e3fd",
                        "primary-fixed-dim": "#c4c7c9",
                        "on-secondary-fixed": "#0d1c2f",
                        "tertiary": "#ffffff",
                        "tertiary-fixed": "#e7e2d9",
                        "surface-container": "#201f1f",
                        "on-error-container": "#ffdad6",
                        "on-tertiary": "#32302a",
                        "on-secondary-fixed-variant": "#3a485c",
                        "surface-tint": "#c4c7c9",
                        "on-primary-fixed-variant": "#444749",
                        "on-surface-variant": "#c4c7c9",
                        "surface-variant": "#353535",
                        "primary-fixed": "#e0e3e5",
                        "surface-container-highest": "#353535",
                        "inverse-surface": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "on-primary-container": "#626567",
                        "on-tertiary-container": "#67645d",
                        "tertiary-fixed-dim": "#cbc6bd",
                        "on-primary": "#2d3133",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary-fixed": "#191c1e",
                        "secondary": "#b9c7e0",
                        "surface-container-low": "#1c1b1b",
                        "on-secondary": "#233144",
                        "secondary-fixed-dim": "#b9c7e0",
                        "primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "xs": "4px",
                        "unit": "4px",
                        "board-width": "320px",
                        "sm": "8px",
                        "xl": "40px",
                        "touch-target": "44px"
                    },
                    "fontFamily": {
                        "label-sm": ["Geist"],
                        "label-mono": ["JetBrains Mono"],
                        "body-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "display": ["Geist"],
                        "headline-md": ["Geist"],
                        "headline-lg": ["Geist"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-mono": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- OVERLAY BACKGROUND (Blurred out game board simulation) -->
<div class="fixed inset-0 z-0 flex items-center justify-center opacity-30 pointer-events-none">
<div class="w-board-width h-[640px] border border-outline-variant bg-surface-container-low grid grid-cols-10 grid-rows-20 gap-[1px] p-[1px]">
<!-- Simulated grid lines -->
<div class="col-span-10 row-span-20 grid grid-cols-10 grid-rows-20 gap-[1px]">
<script>
                    for(let i=0; i<200; i++) {
                        document.write('<div class="bg-surface"></div>');
                    }
                </script>
</div>
</div>
</div>
<!-- MAIN OVERLAY UI -->
<div class="relative z-10 flex-grow flex items-center justify-center p-md bg-[#0F172A]/70 backdrop-blur-[12px]">
<div class="w-full max-w-md bg-surface border border-outline-variant rounded-lg shadow-2xl flex flex-col items-center pt-xl pb-xl px-lg">
<!-- HEADER -->
<div class="text-center mb-xl">
<h1 class="text-display font-display text-primary tracking-tighter mb-sm">GAME OVER</h1>
<p class="text-body-md font-body-md text-on-surface-variant uppercase tracking-widest">End of Simulation</p>
</div>
<!-- HIGH SCORE BADGE -->
<div class="bg-secondary-container/20 border border-secondary text-secondary rounded-full px-md py-xs flex items-center gap-sm mb-lg">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">trophy</span>
<span class="text-label-sm font-label-sm uppercase tracking-wider">New Personal Best</span>
</div>
<!-- STATS BENTO GRID -->
<div class="w-full grid grid-cols-2 gap-sm mb-xl">
<!-- FINAL SCORE (Large spanning top) -->
<div class="col-span-2 bg-surface-container border border-outline-variant rounded p-md flex flex-col items-center justify-center h-[120px]">
<span class="text-label-sm font-label-sm text-on-surface-variant mb-xs">FINAL SCORE</span>
<span class="text-headline-lg font-label-mono text-primary">142,850</span>
</div>
<!-- LEVEL -->
<div class="bg-surface-container border border-outline-variant rounded p-md flex flex-col items-center justify-center h-[96px]">
<span class="text-label-sm font-label-sm text-on-surface-variant mb-xs">LEVEL REACHED</span>
<span class="text-headline-md font-label-mono text-primary">12</span>
</div>
<!-- LINES -->
<div class="bg-surface-container border border-outline-variant rounded p-md flex flex-col items-center justify-center h-[96px]">
<span class="text-label-sm font-label-sm text-on-surface-variant mb-xs">LINES CLEARED</span>
<span class="text-headline-md font-label-mono text-primary">114</span>
</div>
</div>
<!-- ACTIONS -->
<div class="w-full flex flex-col gap-sm">
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary h-touch-target rounded flex items-center justify-center gap-sm hover:brightness-110 active:scale-95 transition-all">
<span class="material-symbols-outlined">replay</span>
<span class="text-label-sm font-label-sm">PLAY AGAIN</span>
</button>
<div class="flex gap-sm">
<!-- Secondary Actions -->
<button class="flex-1 bg-transparent border border-outline-variant text-on-surface h-touch-target rounded flex items-center justify-center gap-sm hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">share</span>
<span class="text-label-sm font-label-sm">SHARE SCORE</span>
</button>
<button class="flex-1 bg-transparent border border-outline-variant text-on-surface h-touch-target rounded flex items-center justify-center gap-sm hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">home</span>
<span class="text-label-sm font-label-sm">MAIN MENU</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
